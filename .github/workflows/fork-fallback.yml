# Fork-only: keep the `fallback` branch rebased on upstream releases and
# publish ghcr.io/<owner>/newt:<upstream>-fallback.<n> images.
name: fork-fallback

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to rebase onto (default: latest release)"
        required: false
  push:
    branches: [fallback]

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: fork-fallback
  cancel-in-progress: false

jobs:
  rebase:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      changed: ${{ steps.rebase.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fallback
          fetch-depth: 0
      - name: Find upstream release
        id: up
        run: |
          git remote add upstream https://github.com/fosrl/newt.git
          git fetch --tags upstream
          tag="${{ inputs.upstream_tag }}"
          if [ -z "$tag" ]; then
            tag=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sort -V | tail -1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Rebase fallback onto upstream release
        id: rebase
        run: |
          git config user.name "fork-bot"
          git config user.email "fork-bot@users.noreply.github.com"
          base=$(git merge-base HEAD "${{ steps.up.outputs.tag }}")
          if [ "$base" = "$(git rev-list -n1 "${{ steps.up.outputs.tag }}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git rebase --onto "${{ steps.up.outputs.tag }}" "$base" fallback
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.rebase.outputs.changed == 'true'
        with:
          go-version-file: go.mod
      - name: Test
        if: steps.rebase.outputs.changed == 'true'
        run: go test ./fallback/ ./bind/ ./newtconfig/ ./newt/ ./clients/
      - name: Push rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease origin fallback
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `fallback rebase onto ${{ steps.up.outputs.tag }} failed`,
              body: `See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          git remote add upstream https://github.com/fosrl/newt.git
          git fetch --tags upstream
          base=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          n=$(git rev-list --count "$base"..HEAD)
          echo "version=${base}-fallback.${n}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./fallback/ ./bind/ ./newtconfig/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/newt:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/newt:fallback
      - name: Tag
        run: |
          git tag "${{ steps.v.outputs.version }}"
          git push origin "${{ steps.v.outputs.version }}"
